[versions]
# Catalogue de versions unique — même rôle qu'une seule épingle de version par dépendance que
# joue Package.swift côté Apple (docs/11-portage-android.md, étape A). Toutes les versions ont
# été vérifiées comme les dernières stables publiées (Maven Central / Google Maven) au moment de
# l'écriture, jamais devinées.
kotlin = "2.4.10"
agp = "9.4.0"
ksp = "2.3.11" # KSP n'est pas encore appliqué à un module (Room/KSP = étape D). Sa version doit
# suivre celle du compilateur Kotlin utilisé au moment de son activation — revérifier alors.
composeBom = "2026.08.00"
room = "2.8.4" # Non utilisé avant l'étape D (:store est vide à ce stade).
navigationCompose = "2.10.0" # Non utilisé avant l'étape E (aucun écran encore).
vico = "3.3.1" # Non utilisé avant l'étape E (aucune courbe encore).
supabaseKt = "3.8.0" # Non utilisé avant l'étape F (:sync est vide à ce stade).
ktorClientOkhttp = "3.5.2" # Idem — moteur HTTP pour supabase-kt, étape F.
kotlinxSerialization = "1.11.0"
kotlinxCoroutines = "1.10.2"
junitJupiter = "6.1.3"
kotest = "6.2.4"
ktlintGradle = "14.2.0"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version = "1.13.0" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version = "1.19.0" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

vico-compose-m3 = { module = "com.patrykandpatrick.vico:compose-m3", version.ref = "vico" }

supabase-bom = { module = "io.github.jan-tennert.supabase:bom", version.ref = "supabaseKt" }
supabase-realtime-kt = { module = "io.github.jan-tennert.supabase:realtime-kt" }
supabase-postgrest-kt = { module = "io.github.jan-tennert.supabase:postgrest-kt" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktorClientOkhttp" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "6.1.3" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
