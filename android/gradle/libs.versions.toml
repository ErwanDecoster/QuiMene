[versions]
# Catalogue de versions unique — même rôle qu'une seule épingle de version par dépendance que
# joue Package.swift côté Apple (docs/11-portage-android.md, étape A). Toutes les versions ont
# été vérifiées comme les dernières stables publiées (Maven Central / Google Maven) au moment de
# l'écriture, jamais devinées.
kotlin = "2.4.10"
agp = "9.2.1"
ksp = "2.3.11" # Vérifié compatible avec Kotlin 2.4.10 à l'usage (étape D) — KSP2 a une
# numérotation indépendante de Kotlin depuis peu, plus le préfixe "<kotlin>-<ksp>" historique.
composeBom = "2026.08.00"
room = "2.8.4"
datastorePreferences = "1.2.1" # Préférences (DeviceIdentity, AppSettings) — équivalent UserDefaults.
navigationCompose = "2.10.0"
lifecycleViewmodelCompose = "2.11.0"
vico = "3.3.1" # Pas encore câblé — étape E couvre la saisie et les résultats, la courbe
# d'évolution (Historique/Profil) reste pour une passe suivante.
supabaseKt = "3.8.0" # Non utilisé avant l'étape F (:sync est vide à ce stade).
ktorClientOkhttp = "3.5.2" # Idem — moteur HTTP pour supabase-kt, étape F.
kotlinxSerialization = "1.11.0"
kotlinxCoroutines = "1.10.2"
junitJupiter = "6.1.3"
junit4 = "4.13.2" # :store uniquement — Robolectric ne fonctionne qu'avec le runner JUnit4.
kotest = "6.2.4"
ktlintGradle = "14.2.0"
robolectric = "4.16.1" # Teste Room en JVM pur (JUnit4), sans émulateur ni appareil — étape D.
androidxTestJunit = "1.3.0"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version = "1.13.0" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version = "1.19.0" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleViewmodelCompose" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastorePreferences" }

vico-compose-m3 = { module = "com.patrykandpatrick.vico:compose-m3", version.ref = "vico" }

supabase-bom = { module = "io.github.jan-tennert.supabase:bom", version.ref = "supabaseKt" }
supabase-realtime-kt = { module = "io.github.jan-tennert.supabase:realtime-kt" }
supabase-postgrest-kt = { module = "io.github.jan-tennert.supabase:postgrest-kt" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktorClientOkhttp" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "6.1.3" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
