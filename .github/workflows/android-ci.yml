name: Android CI

# Xcode Cloud reste propre à Apple (docs/11-portage-android.md, étape A) — nouveau workflow
# dédié à Android, le dépôt n'avait pas de .github/ avant cette étape.

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "spec/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - "spec/**"
      - ".github/workflows/android-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: Build and unit test
        run: ./gradlew build
