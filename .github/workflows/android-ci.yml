name: Android CI

# Xcode Cloud reste propre à Apple (docs/11-portage-android.md, étape A) — ce workflow couvre
# Android, plus les garde-fous partagés qui ne demandent pas de Mac.

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "spec/**"
      - "Scripts/**"
      - "apple/App/Resources/Localizable.xcstrings"
      - "apple/QuiMeneKit/Sources/Catalog/GameDefinitions/**"
      - "apple/QuiMeneKit/Tests/CatalogTests/GoldenResources/**"
      - "apple/QuiMeneKit/Tests/SyncTests/SessionResources/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - "spec/**"
      - "Scripts/**"
      - "apple/App/Resources/Localizable.xcstrings"
      - "apple/QuiMeneKit/Sources/Catalog/GameDefinitions/**"
      - "apple/QuiMeneKit/Tests/CatalogTests/GoldenResources/**"
      - "apple/QuiMeneKit/Tests/SyncTests/SessionResources/**"
      - ".github/workflows/android-ci.yml"

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # spec/ est la seule source de vérité ; les copies embarquées côté Apple doivent suivre.
      - name: spec/ et ses copies
        run: Scripts/check-spec-sync.sh

      # Les strings.xml Android sont générés depuis le catalogue Apple : un changement de
      # catalogue sans relance du script, ou un texte référencé mais absent, échoue ici.
      - name: strings.xml à jour
        run: |
          python3 Scripts/extract-android-strings.py
          git diff --exit-code -- android/app/src/main/res android/l10n-correspondence.json

  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: ./gradlew ktlintCheck

      # Compilation (avertissements Kotlin = erreurs), Android Lint (avertissements = erreurs) et
      # tests unitaires de tous les modules.
      - name: Build and unit test
        run: ./gradlew build
